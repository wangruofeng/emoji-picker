<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emoji 展示选择器</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --text: #1f2328;
    --text-muted: #6b7280;
    --text-faint: #9ca3af;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-soft: #eff6ff;
    --danger: #dc2626;
    --danger-soft: #fef2f2;
    --success: #16a34a;
    --star: #f59e0b;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --radius: 10px;
  }
  html.dark {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --border-strong: #484f58;
    --text: #e6edf3;
    --text-muted: #9198a1;
    --text-faint: #6e7681;
    --accent: #58a6ff;
    --accent-hover: #79b8ff;
    --accent-soft: #1a2332;
    --danger: #f87171;
    --danger-soft: #2a1a1c;
    --success: #3fb950;
    --star: #fbbf24;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Header ---------- */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 650; }
  .logo .mark {
    width: 30px; height: 30px; border-radius: 8px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff; font-size: 16px; font-weight: 700; line-height: 1;
  }
  .logo .sub { font-size: 12px; color: var(--text-muted); font-weight: 400; }
  .spacer { flex: 1; }

  .icon-btn {
    width: 36px; height: 36px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel);
    color: var(--text-muted); cursor: pointer;
    display: grid; place-items: center; transition: all .15s; flex-shrink: 0;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--bg); }
  .icon-btn svg { width: 18px; height: 18px; }
  header .icon-btn { border: none; background: transparent; }
  header .icon-btn:hover { background: var(--bg); }

  /* ---------- 语言切换器 ---------- */
  .lang-wrap { position: relative; flex-shrink: 0; }
  .lang-btn { width: 36px; height: 36px; border-radius: 8px; border: 0; background: transparent; color: var(--text-muted); cursor: pointer; display: grid; place-items: center; transition: all .15s; font-size: 16px; }
  .lang-btn:hover { color: var(--text); background: var(--bg); }
  .lang-menu {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 100;
    min-width: 160px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--shadow); padding: 6px;
    display: none;
  }
  .lang-menu.show { display: block; }
  .lang-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 10px; border: 0; background: transparent; color: var(--text-muted);
    font-size: 13px; cursor: pointer; border-radius: 6px; transition: all .12s; text-align: left;
  }
  .lang-item:hover { background: var(--bg); color: var(--text); }
  .lang-item.active { color: var(--accent); background: var(--accent-soft); }
  .lang-item .check { margin-left: auto; color: var(--accent); }
  .lang-item:not(.active) .check { visibility: hidden; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 20px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .search-wrap {
    flex: 1; position: relative; min-width: 0;
  }
  .search-wrap svg.search-icon {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; color: var(--text-faint); pointer-events: none;
  }
  #searchInput {
    width: 100%; height: 38px; padding: 0 34px 0 34px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font-size: 14px;
    outline: none; transition: border .15s, box-shadow .15s;
  }
  #searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #searchInput::placeholder { color: var(--text-faint); }
  .search-wrap .clear-btn {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; border-radius: 50%; border: 0;
    background: var(--border); color: var(--text-muted); cursor: pointer;
    display: none; align-items: center; justify-content: center; padding: 0;
  }
  .search-wrap .clear-btn:hover { background: var(--border-strong); color: var(--text); }
  .search-wrap .clear-btn.show { display: flex; }
  .search-wrap .clear-btn svg { width: 12px; height: 12px; }
  /* 「/ 聚焦搜索」快捷键提示徽标：聚焦或已有文字时隐藏 */
  .search-wrap .search-hint {
    position: absolute; right: 36px; top: 50%; transform: translateY(-50%);
    font-size: 12px; line-height: 1.4; color: var(--text-faint);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 6px; background: var(--panel); pointer-events: none;
  }
  #searchInput:focus ~ .search-hint,
  .search-wrap .clear-btn.show ~ .search-hint { display: none; }
  /* 触屏无快捷键，不显示 */
  @media (hover: none) { .search-wrap .search-hint { display: none; } }

  .stat { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .stat b { color: var(--text); font-weight: 600; }

  /* ---------- Category tabs ---------- */
  .tabs {
    display: flex; gap: 6px; overflow-x: auto;
    padding: 10px 20px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex-shrink: 0; height: 32px; padding: 0 14px;
    border: 1px solid var(--border); border-radius: 16px;
    background: var(--panel); color: var(--text-muted); font-size: 13px;
    cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .tab-btn:hover { background: var(--bg); color: var(--text); border-color: var(--border-strong); }
  .tab-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  /* ---------- App body ---------- */
  .app-body {
    flex: 1; display: flex; overflow: hidden;
  }
  main {
    /* 顶部不留 padding：sticky 标题 pin 在 content-box 边缘，padding 透明带会让滚动内容穿透 */
    flex: 1; overflow-y: auto; padding: 0 20px 60px;
  }

  /* ---------- Sections & grid ---------- */
  .cat-section { margin-bottom: 28px; }
  /* 首屏顶部间距走 margin（随滚动滚走），不能放 main 的 padding */
  .cat-section:first-child { margin-top: 18px; }
  .cat-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 600; color: var(--text);
    /* 间距全走 padding（在背景内）：margin 透明带会让滚动内容穿透 pin 住的标题 */
    margin: 0; position: sticky; top: 0;
    background: var(--bg); padding: 8px 0 12px; z-index: 5;
  }
  .cat-title .count {
    font-size: 12px; color: var(--text-muted); font-weight: 400;
    background: var(--panel); border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 10px;
  }
  .cat-title .title-clear {
    margin-left: auto; padding: 3px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel);
    color: var(--text-muted); font-size: 12px; cursor: pointer; transition: all .12s;
  }
  .cat-title .title-clear:hover { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
    gap: 8px;
  }
  .emoji-cell {
    aspect-ratio: 1;
    display: grid; place-items: center;
    font-size: 32px; line-height: 1;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .12s, border-color .12s, box-shadow .12s;
    position: relative;
  }
  .emoji-char { display: block; }
  /* iOS 的 Apple Color Emoji 可见字形会略偏离行框中心，单独补偿字形而不影响卡片动画。 */
  @supports (-webkit-touch-callout: none) {
    @media (max-width: 768px) {
      .emoji-char { transform: translateY(18px); }
    }
  }
  .emoji-cell:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    box-shadow: 0 4px 12px rgba(37,99,235,.15);
  }
  .fav-star {
    position: absolute; top: 3px; right: 3px;
    width: 20px; height: 20px; padding: 2px;
    border: 0; background: transparent; cursor: pointer;
    color: var(--text-faint); opacity: 0;
    transition: opacity .12s, color .12s, transform .12s;
  }
  .fav-star svg { width: 100%; height: 100%; display: block; }
  .emoji-cell:hover .fav-star, .fav-star.on { opacity: 1; }
  .fav-star:hover { color: var(--star); transform: scale(1.15); }
  .fav-star.on { color: var(--star); }
  .fav-star.on svg { fill: currentColor; }
  /* 触屏无 hover：星标常显半透明，已收藏保持实色 */
  @media (hover: none) { .fav-star { opacity: .45; } .fav-star.on { opacity: 1; } }
  .emoji-cell.empty { display: none; }

  /* ---------- Empty state ---------- */
  .empty-state {
    max-width: 420px; margin: 10vh auto; text-align: center;
    color: var(--text-muted);
  }
  .empty-state .big {
    font-size: 56px; margin-bottom: 14px;
  }
  .empty-state h3 { margin: 0 0 8px; font-size: 17px; color: var(--text); }
  .empty-state p { margin: 0; font-size: 13.5px; line-height: 1.7; }

  /* ---------- Detail panel ---------- */
  .detail {
    width: 320px; flex-shrink: 0; background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .detail.hidden { display: none; }
  .detail-head {
    padding: 16px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .detail-big {
    width: 72px; height: 72px; font-size: 52px;
    display: grid; place-items: center;
    background: var(--bg); border-radius: var(--radius);
    border: 1px solid var(--border); flex-shrink: 0;
    cursor: zoom-in;
  }
  .detail-names { min-width: 0; }
  .detail-names .cn { font-size: 16px; font-weight: 600; color: var(--text); margin: 0 0 4px; }
  .detail-names .en { font-size: 12px; color: var(--text-muted); margin: 0; word-break: break-word; }
  .detail-body { padding: 14px 18px 24px; }
  .detail-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px;
  }
  .detail-row label {
    width: 78px; flex-shrink: 0; font-size: 12px; color: var(--text-muted);
  }
  .detail-row .value {
    flex: 1; min-width: 0; font-size: 13px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px;
    font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .detail-row .copy-mini {
    width: 28px; height: 28px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel);
    color: var(--text-muted); cursor: pointer;
    display: grid; place-items: center; flex-shrink: 0;
  }
  .detail-row .copy-mini:hover { color: var(--accent); border-color: var(--accent); }
  .detail-row .copy-mini svg { width: 13px; height: 13px; }

  .detail-section-title {
    font-size: 13px; font-weight: 600; color: var(--text-muted);
    margin: 18px 0 10px; text-transform: uppercase; letter-spacing: .03em;
  }

  .skin-row {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .skin-btn {
    width: 44px; height: 44px; font-size: 28px; line-height: 1;
    display: grid; place-items: center;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; cursor: pointer; transition: all .12s;
  }
  .skin-btn:hover { border-color: var(--accent); background: var(--accent-soft); }

  .detail-close {
    display: none; margin-left: 0;
    width: 28px; height: 28px; border-radius: 6px;
    border: 0; background: var(--bg); color: var(--text-muted); cursor: pointer;
  }
  .detail-close:hover { color: var(--text); }
  .detail-fav {
    margin-left: auto; flex-shrink: 0;
    width: 28px; height: 28px; border-radius: 6px; padding: 4px;
    border: 0; background: var(--bg); color: var(--text-muted); cursor: pointer;
    display: grid; place-items: center; transition: color .12s;
  }
  .detail-fav svg { width: 100%; height: 100%; }
  .detail-fav:hover { color: var(--star); }
  .detail-fav.on { color: var(--star); }
  .detail-fav.on svg { fill: currentColor; }

  /* ---------- 放大查看浮层 ---------- */
  #zoomOverlay {
    position: fixed; inset: 0; z-index: 300;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--bg) 72%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    opacity: 0; pointer-events: none; transition: opacity .18s;
  }
  #zoomOverlay.show { opacity: 1; pointer-events: auto; }
  .zoom-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 40px 48px 28px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    max-width: min(90vw, 480px);
  }
  .zoom-emoji { font-size: clamp(120px, 30vw, 200px); line-height: 1.15; user-select: none; }
  .zoom-cn { font-size: 17px; font-weight: 600; color: var(--text); margin: 6px 0 0; }
  .zoom-en { font-size: 13px; color: var(--text-muted); margin: 0; word-break: break-word; text-align: center; }
  .zoom-copy {
    margin-top: 14px; padding: 9px 22px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 14px; cursor: pointer; transition: all .12s;
  }
  .zoom-copy:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .zoom-hint { margin-top: 18px; font-size: 12px; color: var(--text-muted); }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--panel);
    padding: 9px 16px; border-radius: 8px; font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,.2);
    opacity: 0; pointer-events: none; transition: all .22s;
    z-index: 200; display: flex; align-items: center; gap: 7px;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast svg { width: 15px; height: 15px; }

  /* ---------- Tooltip ---------- */
  #tooltip {
    position: fixed; z-index: 150; pointer-events: none;
    background: var(--text); color: var(--panel);
    padding: 5px 10px; border-radius: 6px; font-size: 12px;
    opacity: 0; transform: translate(-50%, -100%); margin-top: -8px;
    transition: opacity .12s; white-space: nowrap;
  }
  #tooltip.show { opacity: 1; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

  @media (max-width: 768px) {
    header { padding: 12px 14px; }
    .toolbar { padding: 8px 14px; }
    .tabs { padding: 8px 14px; }
    main { padding: 0 14px 50px; }
    .cat-section:first-child { margin-top: 12px; }
    .logo .sub { display: none; }
    .emoji-grid { grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; }
    .emoji-cell { font-size: 28px; }
    .app-body { flex-direction: column; }
    .detail {
      width: auto; border-left: 0; border-top: 1px solid var(--border);
      max-height: 45vh; display: none;
    }
    .detail.visible { display: flex; }
    .detail-close { display: grid; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="mark">😀</div>
    <div>
      <span id="appTitle">Emoji 展示选择器</span>
      <div class="sub" id="appSub">中文搜索 / 一键复制 / 码点详情</div>
    </div>
  </div>
  <div class="spacer"></div>
  <a class="icon-btn" id="githubLink" href="https://github.com/wangruofeng/emoji-picker" target="_blank" rel="noopener noreferrer" title="查看 GitHub 源码" aria-label="GitHub 源码仓库">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.37.5 0 5.78 0 12.292c0 5.211 3.438 9.63 8.205 11.188.6.111.82-.254.82-.567 0-.28-.01-1.022-.015-2.005-3.338.711-4.042-1.582-4.042-1.582-.546-1.361-1.335-1.725-1.335-1.725-1.087-.731.084-.716.084-.716 1.205.082 1.838 1.215 1.838 1.215 1.07 1.803 2.809 1.282 3.495.981.108-.763.417-1.282.76-1.577-2.665-.295-5.466-1.309-5.466-5.827 0-1.287.465-2.339 1.235-3.164-.135-.297-.54-1.498.105-3.121 0 0 1.005-.316 3.3 1.209.96-.262 1.98-.392 3-.397 1.02.005 2.04.135 3 .397 2.28-1.525 3.285-1.209 3.285-1.209.645 1.623.24 2.824.12 3.121.765.825 1.23 1.877 1.23 3.164 0 4.53-2.805 5.527-5.475 5.817.42.354.81 1.077.81 2.182 0 1.578-.015 2.846-.015 3.229 0 .309.21.678.825.562C20.565 21.917 24 17.495 24 12.292 24 5.78 18.627.5 12 .5z"/></svg>
  </a>
  <div class="lang-wrap">
    <button class="lang-btn" id="langBtn" title="切换语言 / Language" aria-label="切换语言 / Language">🌐</button>
    <div class="lang-menu" id="langMenu" role="menu"></div>
  </div>
  <button class="icon-btn" id="themeBtn" title="切换深浅色"></button>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="搜索中文名、关键词或英文名（如：笑、heart、火）…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button class="clear-btn" id="clearSearch" title="清空搜索">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <kbd class="search-hint">/</kbd>
  </div>
  <div class="stat" id="statBar"></div>
</div>

<div class="tabs" id="tabs"></div>

<div class="app-body">
  <main id="main"></main>
  <aside class="detail hidden" id="detail">
    <div class="detail-head">
      <div class="detail-big" id="detailBig">😀</div>
      <div class="detail-names">
        <p class="cn" id="detailCn">笑脸</p>
        <p class="en" id="detailEn">grinning face</p>
      </div>
      <button class="detail-fav" id="detailFav" title="收藏" aria-label="收藏"></button>
      <button class="detail-close" id="detailClose" title="关闭详情">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="detail-body">

/* ---------- i18n 核心 ---------- */
// 取当前语言文案。key 为 I18N 的键；可传入变量对象 {x,n} 做占位替换。
function t(key, vars) {
  const dict = I18N[key];
  let s = (dict && dict[state.lang]) || (dict && dict['en']) || (dict && dict['zh-CN']) || key;
  if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}
// 取 emoji 的本地化显示名（回退：当前语言映射 -> zh-CN cn -> en name）
function localName(item) {
  if (state.lang === 'en') return item.name || item.cn;
  const map = EMOJI_NAMES[state.lang];
  if (map && map[item.ch]) return map[item.ch];
  // zh-CN/zh-TW 用中文名；其余语言缺失时回退到英文名更友好
  if (state.lang === 'zh-CN' || state.lang === 'zh-TW') return item.cn || item.name;
  return item.name || item.cn;
}
// 取分类的本地化显示名（key 为内部中文分类名）
function localCat(cat) {
  const map = CAT_I18N[cat];
  if (map && map[state.lang]) return map[state.lang];
  return cat;
}

/* ---------- 通用工具 ---------- */

// 判断字符是否为 BMP 内（码点 <= 0xFFFF）
function isBMP(cp) { return cp <= 0xFFFF; }

// 获取 emoji 的所有 Unicode 码点
function getCodePoints(ch) {
  const out = [];
  for (const cp of ch) {
    out.push(cp.codePointAt(0));
  }
  return out;
}

// Unicode 码点字符串：U+1F600
function toCodePointString(ch) {
  return getCodePoints(ch).map(cp => 'U+' + cp.toString(16).toUpperCase().padStart(4, '0')).join(' ');
}

// UTF-8 字节串：F0 9F 98 80
function toUtf8Bytes(ch) {
  const encoder = new TextEncoder();
  const buf = encoder.encode(ch);
  return Array.from(buf).map(b => b.toString(16).toUpperCase().padStart(2, '0')).join(' ');
}

// HTML 实体：&#x1F600;
function toHtmlEntities(ch) {
  return getCodePoints(ch).map(cp => `&#x${cp.toString(16).toUpperCase()};`).join('');
}

// CSS content：\1F600
function toCssContent(ch) {
  return getCodePoints(ch).map(cp => '\\' + cp.toString(16).toUpperCase()).join('');
}

// JS 转义：\u{1F600}
function toJsEscape(ch) {
  return getCodePoints(ch).map(cp => {
    if (isBMP(cp)) return '\\u' + cp.toString(16).toUpperCase().padStart(4, '0');
    return '\\u{' + cp.toString(16).toUpperCase() + '}';
  }).join('');
}

// 复制到剪贴板
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch {}
  document.body.removeChild(ta);
  return ok;
}

async function copyAndToast(text, msg) {
  if (await copyText(text)) showToast(msg);
  else showToast('复制失败', false);
}

// Toast 提示
let toastTimer;
function showToast(msg, ok = true) {
  const t = $('#toast');
  t.textContent = msg; // 用 textContent 避免 XSS
  t.className = ok ? '' : 'error';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

/* ---------- 主题切换 ---------- */
const themeBtn = $('#themeBtn');
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

function setTheme(dark) {
  document.documentElement.classList.toggle('dark', dark);
  themeBtn.innerHTML = dark ? SUN : MOON;
  themeBtn.title = dark ? t('themeLight') : t('themeDark');
  try { localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light'); } catch {}
}
themeBtn.addEventListener('click', () => setTheme(!document.documentElement.classList.contains('dark')));
try {
  const saved = localStorage.getItem(THEME_KEY);
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  setTheme(saved ? saved === 'dark' : prefersDark);
} catch { setTheme(false); }

/* ---------- 最近使用 ---------- */
function loadRecent() {
  try {
    const raw = localStorage.getItem(RECENT_KEY);
    state.recent = raw ? JSON.parse(raw) : [];
  } catch { state.recent = []; }
}
function saveRecent() {
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(state.recent)); } catch {}
}
function addRecent(ch) {
  state.recent = state.recent.filter(x => x !== ch);
  state.recent.unshift(ch);
  if (state.recent.length > 24) state.recent = state.recent.slice(0, 24);
  saveRecent();
}
loadRecent();

/* ---------- 收藏夹 ---------- */
// 静态星形图标常量（非用户输入，可用 innerHTML）
const STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';

function loadFavs() {
  try {
    const raw = localStorage.getItem(FAV_KEY);
    state.favs = raw ? JSON.parse(raw) : [];
  } catch { state.favs = []; }
}
function saveFavs() {
  try { localStorage.setItem(FAV_KEY, JSON.stringify(state.favs)); } catch {}
}
function isFav(ch) { return state.favs.includes(ch); }
function toggleFav(ch) {
  const on = !isFav(ch);
  state.favs = state.favs.filter(x => x !== ch);
  if (on) state.favs.unshift(ch);
  saveFavs();
  // 同步所有格子上的星标与详情面板星标
  $$('.fav-star').forEach(s => { if (s.dataset.ch === ch) s.classList.toggle('on', on); });
  updateDetailFav();
  showToast(on ? t('favOn', { x: ch }) : t('favOff', { x: ch }));
  // 收藏 tab 下取消收藏：移除该格
  if (state.activeCat === '收藏') renderMain();
}
loadFavs();

/* ---------- 搜索过滤 ---------- */
const searchInput = $('#searchInput');
const clearSearch = $('#clearSearch');

function matches(item, q) {
  q = q.trim().toLowerCase();
  if (!q) return true;
  // 中文名 / 繁体名 / 关键词（简繁中文搜索）
  if (item.cn && item.cn.toLowerCase().includes(q)) return true;
  // 英文名（所有语言始终支持英文搜索）
  if (item.name && item.name.toLowerCase().includes(q)) return true;
  if (item.kw && item.kw.some(k => k.toLowerCase().includes(q))) return true;
  // 当前语言的本地化名（ja/ko/th/ms/zh-TW）
  const map = EMOJI_NAMES[state.lang];
  if (map && map[item.ch] && map[item.ch].toLowerCase().includes(q)) return true;
  return false;
}

function getFilteredItems() {
  let items = EMOJI_DATA;
  if (state.activeCat === '最近使用' || state.activeCat === '收藏') {
    // 按记录顺序，过滤掉已不在数据集中的
    const map = new Map(EMOJI_DATA.map(e => [e.ch, e]));
    const list = state.activeCat === '最近使用' ? state.recent : state.favs;
    items = list.map(ch => map.get(ch)).filter(Boolean);
  } else if (state.activeCat !== '全部') {
    items = EMOJI_DATA.filter(e => e.cat === state.activeCat);
  }
  if (state.query.trim()) {
    items = items.filter(e => matches(e, state.query));
  }
  return items;
}

/* 安全清空容器（避免使用 innerHTML 写入动态内容） */
function clearElement(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
}

/* ---------- 渲染分类标签 ---------- */
function renderTabs() {
  const tabs = $('#tabs');
  clearElement(tabs);
  const keys = ['全部', '最近使用', '收藏', ...CATEGORIES];
  keys.forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (state.activeCat === key ? ' active' : '');
    btn.textContent = localTabLabel(key);
    btn.addEventListener('click', () => {
      state.activeCat = key;
      renderTabs();
      renderMain();
      // 移动端如果打开了详情面板，隐藏它
      if (window.innerWidth <= 768) hideDetail();
    });
    tabs.appendChild(btn);
  });
}
// 取标签（tab）的本地化显示名：全部/最近使用/收藏 走 t()，分类走 localCat()
function localTabLabel(key) {
  if (key === '全部') return t('all');
  if (key === '最近使用') return t('recent');
  if (key === '收藏') return t('favs');
  return localCat(key);
}

/* ---------- 渲染主内容 ---------- */
function renderMain() {
  const main = $('#main');
  clearElement(main);
  const items = getFilteredItems();
  // 重建统计条（含本地化文案与粗体数字）
  const statBar = $('#statBar');
  clearElement(statBar);
  const tmpl = t('stat', { n: items.length, m: EMOJI_DATA.length });
  // 简单拆分：按模板中的数字插入 <b>（数字本身不会被 XSS，仍用 textContent 安全写入）
  const parts = tmpl.split(/(\d+)/);
  parts.forEach(p => {
    if (p === '') return;
    if (/^\d+$/.test(p)) { const b = document.createElement('b'); b.textContent = p; statBar.appendChild(b); }
    else statBar.appendChild(document.createTextNode(p));
  });

  if (items.length === 0) {
    if (state.activeCat === '收藏' && !state.query.trim()) {
      main.appendChild(buildEmpty(t('emptyFavT'), t('emptyFavD'), '⭐'));
    } else if (state.activeCat === '最近使用' && !state.query.trim()) {
      main.appendChild(buildEmpty(t('emptyRecentT'), t('emptyRecentD'), '🕘'));
    } else {
      main.appendChild(buildEmpty(t('emptySearchT'), t('emptySearchD')));
    }
    return;
  }

  if (state.activeCat === '最近使用' || state.activeCat === '收藏' || state.query.trim()) {
    // 搜索 / 最近使用 / 收藏：统一网格展示
    const section = document.createElement('div');
    section.className = 'cat-section';
    const title = document.createElement('h2');
    title.className = 'cat-title';
    title.textContent = state.query.trim() ? t('searchResult') : localTabLabel(state.activeCat);
    const count = document.createElement('span');
    count.className = 'count'; count.textContent = t('countSuffix', { n: items.length });
    title.appendChild(count);
    // 最近使用：一键清空
    if (state.activeCat === '最近使用' && !state.query.trim()) {
      const clear = document.createElement('button');
      clear.className = 'title-clear';
      clear.textContent = t('clear');
      clear.addEventListener('click', () => {
        state.recent = [];
        saveRecent();
        renderMain();
        showToast(t('clearedRecent'));
      });
      title.appendChild(clear);
    }
    section.appendChild(title);
    section.appendChild(buildGrid(items));
    main.appendChild(section);
    return;
  }

  // 分类视图：每个分类一个 section
  const cats = state.activeCat === '全部' ? CATEGORIES : [state.activeCat];
  cats.forEach(cat => {
    const catItems = items.filter(e => e.cat === cat);
    if (catItems.length === 0) return;
    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = 'cat-' + cat;
    const title = document.createElement('h2');
    title.className = 'cat-title';
    title.textContent = localCat(cat);
    const count = document.createElement('span');
    count.className = 'count'; count.textContent = t('countSuffix', { n: catItems.length });
    title.appendChild(count);
    section.appendChild(title);
    section.appendChild(buildGrid(catItems));
    main.appendChild(section);
  });
}

function buildGrid(items) {
  const grid = document.createElement('div');
  grid.className = 'emoji-grid';
  items.forEach(item => {
    const cell = document.createElement('div');
    cell.className = 'emoji-cell';
    const emoji = document.createElement('span');
    emoji.className = 'emoji-char';
    emoji.textContent = item.ch;  // 安全：用 textContent
    cell.appendChild(emoji);
    cell.title = localName(item);
    cell.addEventListener('click', () => selectEmoji(item));
    // 收藏星标（右上角，点击不触发选择）
    const star = document.createElement('button');
    star.className = 'fav-star' + (isFav(item.ch) ? ' on' : '');
    star.dataset.ch = item.ch;
    star.title = t('fav');
    star.setAttribute('aria-label', t('favAria', { x: localName(item) }));
    star.innerHTML = STAR;  // 静态图标常量，非用户输入
    star.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFav(item.ch);
    });
    cell.appendChild(star);
    // tooltip 事件
    cell.addEventListener('mouseenter', (e) => showTooltip(e, localName(item)));
    cell.addEventListener('mousemove', (e) => moveTooltip(e));
    cell.addEventListener('mouseleave', hideTooltip);
    grid.appendChild(cell);
  });
  return grid;
}

function buildEmpty(titleText, desc, big = '🔍') {
  const box = document.createElement('div');
  box.className = 'empty-state';
  const bigEl = document.createElement('div');
  bigEl.className = 'big'; bigEl.textContent = big;
  box.appendChild(bigEl);
  const h = document.createElement('h3'); h.textContent = titleText;
  box.appendChild(h);
  const p = document.createElement('p'); p.textContent = desc;
  box.appendChild(p);
  return box;
}

/* ---------- Tooltip ---------- */
const tooltip = $('#tooltip');
function showTooltip(e, text) {
  tooltip.textContent = text;
  tooltip.classList.add('show');
  moveTooltip(e);
}
function moveTooltip(e) {
  tooltip.style.left = e.clientX + 'px';
  tooltip.style.top = (e.clientY - 8) + 'px';
}
function hideTooltip() {
  tooltip.classList.remove('show');
}

/* ---------- 选择 Emoji ---------- */
function selectEmoji(item) {
  state.selected = item;
  addRecent(item.ch);
  copyAndToast(t('copied', { x: item.ch }), t('copied', { x: item.ch }));
  renderDetail(item);
  showDetail();
}

/* ---------- 详情面板 ---------- */
const detail = $('#detail');
function showDetail() {
  detail.classList.remove('hidden');
  if (window.innerWidth <= 768) detail.classList.add('visible');
}
function hideDetail() {
  detail.classList.add('hidden');
  detail.classList.remove('visible');
}

function updateDetailFav() {
  const btn = $('#detailFav');
  const on = state.selected && isFav(state.selected.ch);
  btn.classList.toggle('on', !!on);
  btn.title = on ? t('unfav') : t('fav');
}

function renderDetail(item) {
  $('#detailBig').textContent = item.ch;
  $('#detailCn').textContent = localName(item);
  $('#detailEn').textContent = item.name;
  updateDetailFav();
  $('#detailCodepoint').textContent = toCodePointString(item.ch);
  $('#detailUtf8').textContent = toUtf8Bytes(item.ch);
  $('#detailHtml').textContent = toHtmlEntities(item.ch);
  $('#detailCss').textContent = toCssContent(item.ch);
  $('#detailJs').textContent = toJsEscape(item.ch);

  // 肤色变体
  const skinRow = $('#skinRow');
  const skinTitle = $('#skinTitle');
  clearElement(skinRow);
  const hasSkin = SKIN_EMOJI.has(item.ch);
  skinTitle.style.display = hasSkin ? 'block' : 'none';
  if (hasSkin) {
    SKIN_TONES.forEach(tone => {
      const btn = document.createElement('button');
      btn.className = 'skin-btn';
      btn.textContent = item.ch + tone;
      btn.title = tone ? t('skinN', { x: tone }) : t('defaultTone');
      btn.addEventListener('click', () => {
        copyAndToast(t('copied', { x: btn.textContent }), t('copied', { x: btn.textContent }));
      });
      skinRow.appendChild(btn);
    });
  }
}

// 详情面板内复制按钮
detail.addEventListener('click', (e) => {
  const btn = e.target.closest('.copy-mini');
  if (!btn) return;
  const targetId = btn.dataset.target;
  const value = $('#' + targetId).textContent;
  copyAndToast(t('copied', { x: value }), t('copiedShort'));
});

const detailFav = $('#detailFav');
detailFav.innerHTML = STAR;  // 静态图标常量
detailFav.addEventListener('click', () => {
  if (state.selected) toggleFav(state.selected.ch);
});
$('#detailClose').addEventListener('click', hideDetail);

/* ---------- 放大查看浮层 ---------- */
const zoomOverlay = $('#zoomOverlay');
function openZoom() {
  const item = state.selected;
  if (!item) return;
  $('#zoomEmoji').textContent = item.ch;
  $('#zoomCn').textContent = localName(item);
  $('#zoomEn').textContent = item.name;
  zoomOverlay.classList.add('show');
}
function closeZoom() {
  zoomOverlay.classList.remove('show');
}
$('#detailBig').addEventListener('click', openZoom);
zoomOverlay.addEventListener('click', (e) => {
  if (!e.target.closest('.zoom-card')) closeZoom();
});
$('#zoomCopy').addEventListener('click', () => {
  if (state.selected) copyAndToast(t('copied', { x: state.selected.ch }), t('copied', { x: state.selected.ch }));
});

/* ---------- 事件绑定 ---------- */
searchInput.addEventListener('input', () => {
  state.query = searchInput.value;
  clearSearch.classList.toggle('show', state.query.length > 0);
  renderMain();
});
clearSearch.addEventListener('click', () => {
  state.query = '';
  searchInput.value = '';
  clearSearch.classList.remove('show');
  searchInput.focus();
  renderMain();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (zoomOverlay.classList.contains('show')) {
      closeZoom();
    } else if (state.query) {
      state.query = '';
      searchInput.value = '';
      clearSearch.classList.remove('show');
      renderMain();
    } else {
      hideDetail();
    }
  }
  // 默认聚焦搜索框：按 / 时
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  }
});

/* ---------- 语言切换 ---------- */
// 根据浏览器语言猜测初始语言（仅首次访问、无本地保存时）
function detectLang() {
  const nav = (navigator.language || navigator.userLanguage || 'zh-CN').toLowerCase();
  if (nav.startsWith('zh-tw') || nav.startsWith('zh-hant')) return 'zh-TW';
  if (nav.startsWith('zh')) return 'zh-CN';
  if (nav.startsWith('ja')) return 'ja';
  if (nav.startsWith('ko')) return 'ko';
  if (nav.startsWith('th')) return 'th';
  if (nav.startsWith('ms')) return 'ms';
  if (nav.startsWith('en')) return 'en';
  return 'zh-CN';
}

// 应用静态 HTML 元素的本地化文案（标题、placeholder、aria、标签等）
function applyStaticI18n() {
  document.title = t('title');
  document.documentElement.lang = state.lang;
  $('#appTitle').textContent = t('title');
  $('#appSub').textContent = t('subtitle');
  const gh = $('#githubLink');
  gh.title = t('githubTitle');
  gh.setAttribute('aria-label', t('githubTitle'));
  $('#langBtn').title = t('langTitle');
  $('#langBtn').setAttribute('aria-label', t('langTitle'));
  searchInput.placeholder = t('searchPh');
  clearSearch.title = t('clearSearch');
  $('#detailFav').title = isFav(state.selected && state.selected.ch) ? t('unfav') : t('fav');
  $('#detailFav').setAttribute('aria-label', t('fav'));
  $('#detailClose').title = t('closeDetail');
  $('#codeInfoTitle').textContent = t('codeInfo');
  $('#jsLabel').textContent = t('jsEscape');
  $('#skinTitle').textContent = t('skinTone');
  $('#zoomCopy').textContent = t('zoomCopy');
  $('#zoomHint').textContent = t('zoomHint');
  $('#zoomOverlay').setAttribute('aria-label', t('zoomAria'));
  // 复制按钮 title（带 data-i18n-title 标记）
  $$('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
}

// 切换语言：保存、刷新界面与全量重渲染
function setLang(code) {
  if (!LANGS[code]) return;
  state.lang = code;
  try { localStorage.setItem(LANG_KEY, code); } catch {}
  // 更新下拉菜单高亮
  renderLangMenu();
  applyStaticI18n();
  renderTabs();
  renderMain();
  if (state.selected) renderDetail(state.selected);
}

// 构建语言下拉菜单
const langBtn = $('#langBtn');
const langMenu = $('#langMenu');
function renderLangMenu() {
  clearElement(langMenu);
  Object.keys(LANGS).forEach(code => {
    const item = document.createElement('button');
    item.className = 'lang-item' + (state.lang === code ? ' active' : '');
    item.setAttribute('role', 'menuitem');
    item.textContent = LANGS[code];
    const check = document.createElement('span');
    check.className = 'check';
    check.textContent = '✓';
    item.appendChild(check);
    item.addEventListener('click', () => {
      setLang(code);
      langMenu.classList.remove('show');
    });
    langMenu.appendChild(item);
  });
}
langBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  langMenu.classList.toggle('show');
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.lang-wrap')) langMenu.classList.remove('show');
});

/* ---------- 初始化 ---------- */
// 先确定语言（本地保存 -> 浏览器语言 -> 默认 zh-CN），再渲染
try {
  const savedLang = localStorage.getItem(LANG_KEY);
  state.lang = (savedLang && LANGS[savedLang]) ? savedLang : detectLang();
} catch { state.lang = detectLang(); }
renderLangMenu();
applyStaticI18n();
renderTabs();
renderMain();
searchInput.focus();
</script>
