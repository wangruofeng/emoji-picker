  /* ---------- Sections & grid ---------- */

  /* 首屏顶部间距走 margin（随滚动滚走），不能放 main 的 padding */
  .cat-section:first-child { margin-top: 18px; }

  .emoji-cell {

  /* ---------- Emoji 详情 Modal ---------- */
  body.modal-open { overflow: hidden; }

const EMOJI_17_SINGLE_CODEPOINTS = new Set([
  0x1FAEA, // distorted face
  0x1FAEF, // fight cloud
  0x1FAC8, // hairy creature
  0x1FACD, // orca
  0x1F6D8, // landslide
  0x1FA8A, // trombone
  0x1FA8E, // treasure chest
]);
const EMOJI_SKIN_TONE_CODEPOINTS = new Set([0x1F3FB, 0x1F3FC, 0x1F3FD, 0x1F3FE, 0x1F3FF]);

function needsEmoji17ImageFallback(item) {
  const codepoints = Array.from(item.ch, char => char.codePointAt(0));
  const set = new Set(codepoints);

  if (codepoints.length === 1 && EMOJI_17_SINGLE_CODEPOINTS.has(codepoints[0])) return true;
  // ballet dancer：person + ZWJ + ballet shoes（含肤色变体）
  if (set.has(0x200D) && set.has(0x1FA70)) return true;
  if (!codepoints.some(cp => EMOJI_SKIN_TONE_CODEPOINTS.has(cp))) return false;
  // Emoji 17 新增的带肤色兔耳舞者与摔跤系列，包括双人物独立肤色组合。
  return set.has(0x1F46F) || set.has(0x1F430) || set.has(0x1F93C) || set.has(0x1FAEF);
}

  item.cn = `${base.cn}：${tones.join('、')}`;
  item.kw = [...new Set([...item.kw, item.cn, base.cn, ...tones])];

  const regionName = regionCode.length === 2 && zhCNRegionNames?.of(regionCode);
  return regionName && regionName !== regionCode ? `旗: ${regionName}` : item.cn;
}

// 取 emoji 的本地化显示名（回退：当前语言映射 -> zh-CN cn -> en name）
function localName(item) {
  if (state.lang === 'en') return item.name || item.cn;
  const map = EMOJI_NAMES[state.lang];
  if (map && map[item.ch]) return map[item.ch];
  // zh-CN/zh-TW 用中文名；其余语言缺失时回退到英文名更友好
  if (state.lang === 'zh-CN') return localZhCNFlagName(item) || item.name;
  if (state.lang === 'zh-TW') return item.cn || item.name;
  return item.name || item.cn;
}
// 取分类的本地化显示名（key 为内部中文分类名）
function localCat(cat) {
  const map = CAT_I18N[cat];
  if (map && map[state.lang]) return map[state.lang];
  return cat;
}

/* ---------- 通用工具 ---------- */

// 判断字符是否为 BMP 内（码点 <= 0xFFFF）
function isBMP(cp) { return cp <= 0xFFFF; }

// 获取 emoji 的所有 Unicode 码点
function getCodePoints(ch) {
  const out = [];
  for (const cp of ch) {
    out.push(cp.codePointAt(0));
  }
  return out;
}

// Unicode 码点字符串：U+1F600
function toCodePointString(ch) {
  return getCodePoints(ch).map(cp => 'U+' + cp.toString(16).toUpperCase().padStart(4, '0')).join(' ');
}

// UTF-8 字节串：F0 9F 98 80
function toUtf8Bytes(ch) {
  const encoder = new TextEncoder();
  const buf = encoder.encode(ch);
  return Array.from(buf).map(b => b.toString(16).toUpperCase().padStart(2, '0')).join(' ');
}

// HTML 实体：&#x1F600;
function toHtmlEntities(ch) {
  return getCodePoints(ch).map(cp => `&#x${cp.toString(16).toUpperCase()};`).join('');
}

function toDecimalCodePoints(ch) {
  return getCodePoints(ch).join(' ');
}

function toHtmlDecimalEntities(ch) {
  return getCodePoints(ch).map(cp => `&#${cp};`).join('');
}

// CSS content：\1F600
function toCssContent(ch) {
  return getCodePoints(ch).map(cp => '\\' + cp.toString(16).toUpperCase()).join('');
}

// JS 转义：\u{1F600}
function toJsEscape(ch) {
  return getCodePoints(ch).map(cp => {
    if (isBMP(cp)) return '\\u' + cp.toString(16).toUpperCase().padStart(4, '0');
    return '\\u{' + cp.toString(16).toUpperCase() + '}';
  }).join('');
}

function getFlagRegionCode(ch) {
  const cps = getCodePoints(ch);
  if (cps.length === 2 && cps.every(cp => cp >= 0x1F1E6 && cp <= 0x1F1FF)) {
    return String.fromCharCode(...cps.map(cp => cp - 0x1F1E6 + 65));
  }
  if (cps[0] === 0x1F3F4 && cps[cps.length - 1] === 0xE007F) {
    return cps.slice(1, -1).map(cp => String.fromCharCode(cp - 0xE0000)).join('');
  }
  return '';
}

function getFlagContinent(item) {
  if (item.cat !== '旗帜') return '';
  const regionCode = getFlagRegionCode(item.ch);
  return CONTINENT_BY_REGION.get(regionCode) || SUBDIVISION_CONTINENTS[regionCode] || '';
}

const SKIN_TONE_KEYS = {
  0x1F3FB: 'lightTone',
  0x1F3FC: 'mediumLightTone',
  0x1F3FD: 'mediumTone',
  0x1F3FE: 'mediumDarkTone',
  0x1F3FF: 'darkTone',
};

function buildCodePointParts(ch) {
  return getCodePoints(ch).map(cp => {
    let roleKey = 'baseCharacter';
    if (cp === 0x200D) roleKey = 'zwjRole';
    else if (cp === 0xFE0F) roleKey = 'variationRole';
    else if (SKIN_TONE_KEYS[cp]) roleKey = 'skinRole';
    else if (cp === 0x2640 || cp === 0x2642) roleKey = 'genderRole';
    return {
      cp,
      glyph: cp === 0x200D ? 'ZWJ' : cp === 0xFE0F ? 'VS16' : String.fromCodePoint(cp),
      codepoint: 'U+' + cp.toString(16).toUpperCase().padStart(4, '0'),
      decimal: String(cp),
      role: t(roleKey),
    };
  });
}

function buildEmojiDetailModel(item) {
  const cps = getCodePoints(item.ch);
  const toneKeys = cps.filter(cp => SKIN_TONE_KEYS[cp]).map(cp => SKIN_TONE_KEYS[cp]);
  const hasZWJ = cps.includes(0x200D);
  const hasFemale = cps.includes(0x2640);
  const hasMale = cps.includes(0x2642);
  const composition = hasZWJ ? t('zwjSequence')
    : toneKeys.length ? t('modifierSequence')
    : cps.length === 1 ? t('singleCodepoint') : t('multiCodepoint');
  const gender = hasFemale ? t('female') : hasMale ? t('male') : t('neutral');
  const fallback = EMOJI_IMAGE_FALLBACK.has(item.ch);
  const continent = getFlagContinent(item);
  const properties = [
    [t('category'), localCat(item.cat)],
  ];
  if (continent) properties.push([t('continent'), t(continent)]);
  properties.push(
    [t('codepointCount'), String(cps.length)],
    [t('composition'), composition],
    [t('skinTone'), toneKeys.length ? toneKeys.map(key => t(key)).join(' + ') : t('noSkinTone')],
    [t('gender'), gender],
    [t('presentation'), cps.includes(0xFE0F) ? t('emojiStyle') : t('defaultStyle')],
    [t('renderSource'), fallback ? t('notoRender') : t('nativeRender')],
    [t('dataStandard'), 'Unicode Emoji 17.0'],
  );
  if (fallback) properties.push([t('introduced'), 'Emoji 17.0']);
  return {
    item,
    name: localName(item),
    englishName: item.name,
    encodings: [
      ['Unicode', toCodePointString(item.ch)],
      [t('decimalCodepoints'), toDecimalCodePoints(item.ch)],
      ['UTF-8', toUtf8Bytes(item.ch)],
      ['HTML', toHtmlEntities(item.ch)],
      [t('htmlDecimal'), toHtmlDecimalEntities(item.ch)],
      ['CSS', toCssContent(item.ch)],
      [t('jsEscape'), toJsEscape(item.ch)],
    ],
    properties,
    parts: buildCodePointParts(item.ch),
    tags: [localCat(item.cat), composition, ...(fallback ? ['Emoji 17.0'] : [])],
    keywords: Array.from(new Set(item.kw || []))
      .filter(keyword => keyword !== item.cn && keyword !== item.name)
      .slice(0, 24),
  };
}

function renderPropertyList(container, entries) {
  clearElement(container);
  entries.forEach(([label, value]) => {
    const row = document.createElement('div');
    row.className = 'property-item';
    const dt = document.createElement('dt');

    dd.textContent = value;
    row.append(dt, dd);
    container.appendChild(row);
  });
}

function renderTags(container, tags) {

  tags.forEach(text => {
    const tag = document.createElement('span');
    tag.className = 'info-tag';
    tag.textContent = text;
    container.appendChild(tag);
  });
}

// Google Noto Emoji 使用 `emoji_u<hex>_<hex>.png` 的码点序列命名，但文件名
// 不包含 Emoji 表现选择符 U+FE0F。ZWJ、肤色修饰符等其余码点必须完整保留。
function emojiImageUrl(ch) {
  return NOTO_EMOJI_CDN + 'emoji_u' + getCodePoints(ch)
    .filter(cp => cp !== 0xFE0F)
    .map(cp => cp.toString(16))
    .join('_') + '.png';
}

function makeEmojiNode(ch, className = 'emoji-char') {
  if (!EMOJI_IMAGE_FALLBACK.has(ch)) {
    const text = document.createElement('span');
    text.className = className;
    text.textContent = ch;
    return text;
  }

  const image = document.createElement('img');
  image.className = className + ' emoji-image';
  image.src = emojiImageUrl(ch);
  image.alt = ch;
  image.decoding = 'async';
  image.loading = 'lazy';
  image.addEventListener('error', () => {
    // 网络或 CDN 不可用时宁可明确显示占位符，也不要回退为会产生横条的缺字文本。
    const fallback = document.createElement('span');
    fallback.className = className + ' emoji-unsupported';
    fallback.textContent = '◌';
    fallback.title = toCodePointString(ch);
    image.replaceWith(fallback);
  }, { once: true });
  return image;
}

function setEmojiDisplay(container, ch) {
  clearElement(container);
  container.appendChild(makeEmojiNode(ch));
}

// Toast 不能嵌入尚未被系统字体支持的原始序列，否则会再次出现缺字横条。
function emojiTextLabel(ch) {
  return EMOJI_IMAGE_FALLBACK.has(ch) ? toCodePointString(ch) : ch;
}

// 复制到剪贴板
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch {}
  document.body.removeChild(ta);
  return ok;
}

async function copyAndToast(text, msg) {
  if (await copyText(text)) showToast(msg);
  else showToast('复制失败', false);
}

// Toast 提示
let toastTimer;
function showToast(msg, ok = true) {
  const t = $('#toast');
  t.textContent = msg; // 用 textContent 避免 XSS
  t.className = ok ? '' : 'error';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

/* ---------- 搜索过滤 ---------- */
const searchInput = $('#searchInput');
const clearSearch = $('#clearSearch');

function matches(item, q) {
  q = q.trim().toLowerCase();
  if (!q) return true;
  // 支持直接粘贴 Emoji 字符搜索。
  if (item.ch && item.ch.includes(q)) return true;
  // 中文名 / 繁体名 / 关键词（简繁中文搜索）
  if (item.cn && item.cn.toLowerCase().includes(q)) return true;
  if (state.lang === 'zh-CN' && localZhCNFlagName(item).toLowerCase().includes(q)) return true;
  // 英文名（所有语言始终支持英文搜索）
  if (item.name && item.name.toLowerCase().includes(q)) return true;
  if (item.kw && item.kw.some(k => k.toLowerCase().includes(q))) return true;
  // 当前语言的本地化名（ja/ko/th/ms/zh-TW）
  const map = EMOJI_NAMES[state.lang];
  if (map && map[item.ch] && map[item.ch].toLowerCase().includes(q)) return true;
  return false;
}

function getFilteredItems() {
  let items = EMOJI_DATA;
  if (state.activeCat === '最近使用' || state.activeCat === '收藏') {
    // 按记录顺序，过滤掉已不在数据集中的
    const map = new Map(EMOJI_DATA.map(e => [e.ch, e]));
    const list = state.activeCat === '最近使用' ? state.recent : state.favs;
    items = list.map(ch => map.get(ch)).filter(Boolean);
  } else if (state.activeCat !== '全部') {
    items = EMOJI_DATA.filter(e => e.cat === state.activeCat);
  }
  if (state.query.trim()) {
    items = items.filter(e => matches(e, state.query));
  }
  return items;
}

/* 安全清空容器（避免使用 innerHTML 写入动态内容） */
function clearElement(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
}

/* ---------- 渲染分类标签 ---------- */
function renderTabs() {
  const tabs = $('#tabs');
  clearElement(tabs);

  keys.forEach(key => {

    btn.textContent = localTabLabel(key);

      renderTabs();

      // 移动端如果打开了详情面板，隐藏它
      if (window.innerWidth <= 768) hideDetail();
    });
    tabs.appendChild(btn);
  });
}
// 取标签（tab）的本地化显示名：全部/最近使用/收藏 走 t()，分类走 localCat()
function localTabLabel(key) {
  if (key === '全部') return t('all');
  if (key === '最近使用') return t('recent');
  if (key === '收藏') return t('favs');
  return localCat(key);
}

/* ---------- 渲染主内容 ---------- */
const INITIAL_CATEGORY_BATCH = 36;
const INITIAL_GRID_BATCH = 72;
const GRID_BATCH_SIZE = 72;
let gridLoadObserver;

function resetLazyGrids() {
  if (gridLoadObserver) {
    gridLoadObserver.disconnect();
    gridLoadObserver = null;
  }
}

function getGridLoadObserver() {
  if (!gridLoadObserver && 'IntersectionObserver' in window) {
    gridLoadObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.loadNextBatch?.();
      });
    }, { root: $('#main'), rootMargin: '0px 0px 600px' });
  }
  return gridLoadObserver;
}

function renderMain() {
  resetLazyGrids();
  const main = $('#emojiContent');
  clearElement(main);
  const items = getFilteredItems();
  // 重建统计条（含本地化文案与粗体数字）
  const statBar = $('#statBar');
  clearElement(statBar);
  const tmpl = t('stat', { n: items.length, m: EMOJI_DATA.length });
  // 简单拆分：按模板中的数字插入 <b>（数字本身不会被 XSS，仍用 textContent 安全写入）
  const parts = tmpl.split(/(\d+)/);
  parts.forEach(p => {
    if (p === '') return;
    if (/^\d+$/.test(p)) { const b = document.createElement('b'); b.textContent = p; statBar.appendChild(b); }
    else statBar.appendChild(document.createTextNode(p));
  });

  if (items.length === 0) {
    if (state.activeCat === '收藏' && !state.query.trim()) {
      main.appendChild(buildEmpty(t('emptyFavT'), t('emptyFavD'), '⭐'));
    } else if (state.activeCat === '最近使用' && !state.query.trim()) {
      main.appendChild(buildEmpty(t('emptyRecentT'), t('emptyRecentD'), '🕘'));
    } else {
      main.appendChild(buildEmpty(t('emptySearchT'), t('emptySearchD')));
    }
    return;
  }

  if (state.activeCat === '最近使用' || state.activeCat === '收藏' || state.query.trim()) {
    // 搜索 / 最近使用 / 收藏：统一网格展示
    const section = document.createElement('div');
    section.className = 'cat-section';
    const title = document.createElement('h2');
    title.className = 'cat-title';
    title.textContent = state.query.trim() ? t('searchResult') : localTabLabel(state.activeCat);
    const count = document.createElement('span');
    count.className = 'count'; count.textContent = t('countSuffix', { n: items.length });
    title.appendChild(count);
    // 最近使用：一键清空
    if (state.activeCat === '最近使用' && !state.query.trim()) {
      const clear = document.createElement('button');
      clear.className = 'title-clear';
      clear.textContent = t('clear');
      clear.addEventListener('click', () => {
        state.recent = [];
        saveRecent();
        renderMain();
        showToast(t('clearedRecent'));
      });
      title.appendChild(clear);
    }
    section.appendChild(title);
    section.appendChild(buildGrid(items, INITIAL_GRID_BATCH));
    main.appendChild(section);
    return;
  }

  // 分类视图：每个分类一个 section
  const cats = state.activeCat === '全部' ? CATEGORIES : [state.activeCat];
  cats.forEach(cat => {
    const catItems = items.filter(e => e.cat === cat);
    if (catItems.length === 0) return;
    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = 'cat-' + cat;
    const title = document.createElement('h2');
    title.className = 'cat-title';
    title.textContent = localCat(cat);
    const count = document.createElement('span');
    count.className = 'count'; count.textContent = t('countSuffix', { n: catItems.length });
    title.appendChild(count);
    section.appendChild(title);
    section.appendChild(buildGrid(catItems, state.activeCat === '全部' ? INITIAL_CATEGORY_BATCH : INITIAL_GRID_BATCH));
    main.appendChild(section);
  });
}

function buildGrid(items, initialBatch) {
  const wrapper = document.createElement('div');
  wrapper.className = 'emoji-grid-wrap';
  const grid = document.createElement('div');
  grid.className = 'emoji-grid';
  wrapper.appendChild(grid);
  let nextIndex = 0;

  const appendNextBatch = () => {
    const batch = items.slice(nextIndex, nextIndex + GRID_BATCH_SIZE);
    nextIndex += batch.length;
    appendEmojiCells(grid, batch);
    if (nextIndex >= items.length) {
      gridLoadObserver?.unobserve(sentinel);
      sentinel.remove();
    }
  };

  const sentinel = document.createElement('div');
  sentinel.className = 'emoji-load-sentinel';
  sentinel.loadNextBatch = appendNextBatch;
  wrapper.appendChild(sentinel);

  appendEmojiCells(grid, items.slice(0, initialBatch));
  nextIndex = Math.min(initialBatch, items.length);
  if (nextIndex >= items.length) {
    sentinel.remove();
  } else {
    getGridLoadObserver()?.observe(sentinel);
  }
  return wrapper;
}

function appendEmojiCells(grid, items) {
  items.forEach(item => {
    const cell = document.createElement('div');
    cell.className = 'emoji-cell';
    cell.appendChild(makeEmojiNode(item.ch));
    cell.addEventListener('click', () => selectEmoji(item));
    // 收藏星标（右上角，点击不触发选择）
    const star = document.createElement('button');
    star.className = 'fav-star' + (isFav(item.ch) ? ' on' : '');
    star.dataset.ch = item.ch;
    star.title = t('fav');
    star.setAttribute('aria-label', t('favAria', { x: localName(item) }));
    star.innerHTML = STAR;  // 静态图标常量，非用户输入
    star.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFav(item.ch);
    });
    cell.appendChild(star);
    // tooltip 事件
    cell.addEventListener('mouseenter', (e) => showTooltip(e, localName(item)));
    cell.addEventListener('mouseleave', hideTooltip);
    grid.appendChild(cell);
  });
}

function buildEmpty(titleText, desc, big = '🔍') {
  const box = document.createElement('div');
  box.className = 'empty-state';
  const bigEl = document.createElement('div');
  bigEl.className = 'big'; bigEl.textContent = big;
  box.appendChild(bigEl);
  const h = document.createElement('h3'); h.textContent = titleText;
  box.appendChild(h);
  const p = document.createElement('p'); p.textContent = desc;
  box.appendChild(p);
  return box;
}

/* ---------- Tooltip ---------- */
const tooltip = $('#tooltip');
function showTooltip(e, text) {
  tooltip.textContent = text;
  tooltip.classList.add('show');
  const rect = e.currentTarget.getBoundingClientRect();
  tooltip.style.left = (rect.left + rect.width / 2) + 'px';
  // 固定在卡片正上方，避免鼠标位于卡片中下部时提示浮层遮挡首行的 hover 边框。
  tooltip.style.top = (rect.top - 4) + 'px';
}
function hideTooltip() {
  tooltip.classList.remove('show');
}

/* ---------- 选择 Emoji ---------- */
function selectEmoji(item) {
  state.selected = item;
  addRecent(item.ch);
  copyAndToast(item.ch, t('copied', { x: emojiTextLabel(item.ch) }));
  if (window.innerWidth <= 768) {
    hideDetail();
    openZoom();
    return;
  }
  renderDetail(item);
  showDetail();
}

/* ---------- 详情面板 ---------- */
const detail = $('#detail');
function showDetail() {
  detail.classList.remove('hidden');
  if (window.innerWidth <= 768) detail.classList.add('visible');
}
function hideDetail() {
  detail.classList.add('hidden');
  detail.classList.remove('visible');
}

function updateDetailFav() {
  const btn = $('#detailFav');
  const on = state.selected && isFav(state.selected.ch);
  btn.classList.toggle('on', !!on);
  btn.title = on ? t('unfav') : t('fav');
  btn.setAttribute('aria-label', btn.title);
}

function renderDetail(item) {
  const model = buildEmojiDetailModel(item);
  const name = model.name;
  const description = model.englishName;
  setEmojiDisplay($('#detailBig'), item.ch);
  $('#detailBig').setAttribute('aria-label', t('zoomAria') + ': ' + name);
  $('#detailCn').textContent = name;
  $('#detailEn').textContent = description;
  $('#detailEn').hidden = name === description;
  updateDetailFav();
  $('#detailCodepoint').textContent = toCodePointString(item.ch);
  $('#detailUtf8').textContent = toUtf8Bytes(item.ch);
  $('#detailHtml').textContent = toHtmlEntities(item.ch);
  $('#detailCss').textContent = toCssContent(item.ch);
  $('#detailJs').textContent = toJsEscape(item.ch);
  renderPropertyList($('#detailProperties'), model.properties);
  renderTags($('#detailTags'), model.tags);

  // 肤色变体
  const skinRow = $('#skinRow');
  const skinTitle = $('#skinTitle');
  clearElement(skinRow);
  const hasSkin = SKIN_EMOJI.has(item.ch);
  skinTitle.style.display = hasSkin ? 'block' : 'none';
  if (hasSkin) {
    SKIN_TONES.forEach(tone => {
      const btn = document.createElement('button');
      btn.className = 'skin-btn';
      btn.textContent = item.ch + tone;
      btn.title = tone ? t('skinN', { x: tone }) : t('defaultTone');
      btn.addEventListener('click', () => {
        copyAndToast(btn.textContent, t('copied', { x: btn.textContent }));
      });
      skinRow.appendChild(btn);
    });
  }
}

// 详情面板内复制按钮
detail.addEventListener('click', (e) => {
  const btn = e.target.closest('.copy-mini');
  if (!btn) return;
  const targetId = btn.dataset.target;
  const value = $('#' + targetId).textContent;
  copyAndToast(value, t('copiedShort'));
});

const detailFav = $('#detailFav');
detailFav.innerHTML = STAR;  // 静态图标常量
detailFav.addEventListener('click', () => {
  if (state.selected) toggleFav(state.selected.ch);
});
$('#detailClose').addEventListener('click', hideDetail);

/* ---------- 放大查看浮层 ---------- */
const zoomOverlay = $('#zoomOverlay');
let lastFocusedBeforeZoom = null;

function updateZoomFav() {
  const btn = $('#zoomFav');
  if (!btn) return;
  const on = state.selected && isFav(state.selected.ch);
  btn.classList.toggle('on', !!on);
  btn.title = on ? t('unfav') : t('fav');
  btn.setAttribute('aria-label', btn.title);
}

function createEncodingRow(label, value, index) {
  const row = document.createElement('div');
  row.className = 'detail-row';
  const labelEl = document.createElement('label');
  labelEl.textContent = label;
  const valueEl = document.createElement('div');
  valueEl.className = 'value';
  valueEl.id = 'zoomEncoding' + index;
  valueEl.textContent = value;
  const button = document.createElement('button');
  button.className = 'copy-mini';
  button.type = 'button';
  button.dataset.copyValue = value;
  button.title = t('zoomCopy') + ' ' + label;
  button.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  row.append(labelEl, valueEl, button);
  return row;
}

function renderZoom(item) {
  const model = buildEmojiDetailModel(item);
  setEmojiDisplay($('#zoomEmoji'), item.ch);
  $('#zoomCn').textContent = model.name;
  $('#zoomEn').textContent = model.englishName;
  $('#zoomEn').hidden = model.name === model.englishName;
  renderTags($('#zoomTags'), model.tags);
  renderPropertyList($('#zoomProperties'), model.properties);
  const encodingBox = $('#zoomEncodings');
  clearElement(encodingBox);
  model.encodings.forEach(([label, value], index) => encodingBox.appendChild(createEncodingRow(label, value, index)));
  const partsBox = $('#codepointParts');
  clearElement(partsBox);
  model.parts.forEach(part => {
    const row = document.createElement('div');
    row.className = 'codepoint-part';
    const glyph = document.createElement('div');
    glyph.className = 'codepoint-glyph' + (part.cp === 0x200D ? ' zwj' : part.cp === 0xFE0F ? ' vs16' : '');
    glyph.textContent = part.glyph;
    const code = document.createElement('div');
    code.className = 'codepoint-code';
    code.textContent = part.codepoint + ' · ' + part.decimal;
    const role = document.createElement('div');
    role.className = 'codepoint-role';
    role.textContent = part.role;
    row.append(glyph, code, role);
    partsBox.appendChild(row);
  });
  renderTags($('#zoomKeywords'), model.keywords);
  updateZoomFav();
}

function openZoom() {
  const item = state.selected;
  if (!item) return;
  lastFocusedBeforeZoom = document.activeElement;
  renderZoom(item);
  zoomOverlay.classList.add('show');
  zoomOverlay.setAttribute('aria-hidden', 'false');
  document.body.classList.add('modal-open');
  requestAnimationFrame(() => $('#zoomClose').focus());
}
function closeZoom() {
  zoomOverlay.classList.remove('show');
  zoomOverlay.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('modal-open');
  if (lastFocusedBeforeZoom && document.contains(lastFocusedBeforeZoom)) lastFocusedBeforeZoom.focus();
}
$('#detailBig').addEventListener('click', openZoom);
$('#detailBig').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openZoom(); }
});
zoomOverlay.addEventListener('click', (e) => {
  if (!e.target.closest('.zoom-card')) closeZoom();
  const copyButton = e.target.closest('[data-copy-value]');
  if (copyButton) copyAndToast(copyButton.dataset.copyValue, t('copiedShort'));
});
$('#zoomClose').addEventListener('click', closeZoom);
$('#zoomFav').innerHTML = STAR;
$('#zoomFav').addEventListener('click', () => {
  if (state.selected) toggleFav(state.selected.ch);
});
$('#zoomCopy').addEventListener('click', () => {
  if (state.selected) copyAndToast(state.selected.ch, t('copied', { x: emojiTextLabel(state.selected.ch) }));
});
$('#zoomShare').addEventListener('click', () => {
  if (!state.selected) return;
  const url = new URL(window.location.href);
  url.searchParams.set('q', state.selected.ch);
  copyAndToast(url.toString(), t('linkCopied'));
});

/* ---------- 事件绑定 ---------- */
searchInput.addEventListener('input', () => {
  state.query = searchInput.value;
  clearSearch.classList.toggle('show', state.query.length > 0);
  renderMain();
});
clearSearch.addEventListener('click', () => {
  state.query = '';
  searchInput.value = '';
  clearSearch.classList.remove('show');
  searchInput.focus();
  renderMain();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Tab' && zoomOverlay.classList.contains('show')) {
    const focusable = Array.from(zoomOverlay.querySelectorAll('button:not([disabled]), [href], [tabindex]:not([tabindex="-1"])'))
      .filter(el => !el.hidden && el.offsetParent !== null);
    if (focusable.length) {
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }
  if (e.key === 'Escape') {
    if (zoomOverlay.classList.contains('show')) {
      closeZoom();
    } else if (state.query) {
      state.query = '';
      searchInput.value = '';
      clearSearch.classList.remove('show');
      renderMain();
    } else if (state.activeCat !== '全部') {
      state.activeCat = '全部';
      renderTabs();
      renderMain();
    } else {
      hideDetail();
    }
  }
  // 默认聚焦搜索框：按 / 时
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  }
});

/* ---------- 语言切换 ---------- */
// 根据浏览器语言猜测初始语言（仅首次访问、无本地保存时）
function detectLang() {
  const nav = (navigator.language || navigator.userLanguage || 'zh-CN').toLowerCase();
  if (nav.startsWith('zh-tw') || nav.startsWith('zh-hant')) return 'zh-TW';
  if (nav.startsWith('zh')) return 'zh-CN';
  if (nav.startsWith('ja')) return 'ja';
  if (nav.startsWith('ko')) return 'ko';
  if (nav.startsWith('th')) return 'th';
  if (nav.startsWith('ms')) return 'ms';
  if (nav.startsWith('en')) return 'en';
  return 'zh-CN';
}

// 应用静态 HTML 元素的本地化文案（标题、placeholder、aria、标签等）
function applyStaticI18n() {
  document.title = t('title');
  document.documentElement.lang = state.lang;
  $('#pageHeading').textContent = t('seoTitle');
  $('#pageDescription').textContent = t('seoDescription');
  $('#appTitle').textContent = t('title');
  $('#appSub').textContent = t('subtitle');
  const gh = $('#githubLink');
  gh.title = t('githubTitle');
  gh.setAttribute('aria-label', t('githubTitle'));
  $('#langBtn').title = t('langTitle');
  $('#langBtn').setAttribute('aria-label', t('langTitle'));
  searchInput.placeholder = t('searchPh');
  clearSearch.title = t('clearSearch');
  $('#detailFav').title = isFav(state.selected && state.selected.ch) ? t('unfav') : t('fav');
  $('#detailFav').setAttribute('aria-label', t('fav'));
  $('#detailClose').title = t('closeDetail');
  $('#codeInfoTitle').textContent = t('codeInfo');
  $('#propertiesTitle').textContent = t('emojiProperties');
  $('#tagsTitle').textContent = t('tags');
  $('#jsLabel').textContent = t('jsEscape');
  $('#skinTitle').textContent = t('skinTone');
  $('#zoomEncodingTitle').textContent = t('codeInfo');
  $('#zoomPropertiesTitle').textContent = t('emojiProperties');
  $('#codepointPartsTitle').textContent = t('codepointParts');
  $('#keywordsTitle').textContent = t('keywords');
  $('#zoomCopy').textContent = t('zoomCopy') + ' Emoji';
  $('#zoomShare').textContent = t('shareLink');
  $('#zoomClose').title = t('closeModal');
  $('#zoomClose').setAttribute('aria-label', t('closeModal'));
  $('#zoomHint').textContent = t('zoomHint');
  $('#zoomOverlay').setAttribute('aria-label', t('zoomAria'));
  // 复制按钮 title（带 data-i18n-title 标记）
  $$('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
}

// 切换语言：保存、刷新界面与全量重渲染
function setLang(code) {
  if (!LANGS[code]) return;
  state.lang = code;
  try { localStorage.setItem(LANG_KEY, code); } catch {}
  // 更新下拉菜单高亮
  renderLangMenu();
  applyStaticI18n();
  renderTabs();
  renderMain();
  if (state.selected) {
    renderDetail(state.selected);
    if (zoomOverlay.classList.contains('show')) renderZoom(state.selected);
  }
}

// 构建语言下拉菜单
const langBtn = $('#langBtn');
const langMenu = $('#langMenu');
function renderLangMenu() {
  clearElement(langMenu);
  Object.keys(LANGS).forEach(code => {
    const item = document.createElement('button');
    item.className = 'lang-item' + (state.lang === code ? ' active' : '');
    item.setAttribute('role', 'menuitem');
    item.textContent = LANGS[code];
    const check = document.createElement('span');
    check.className = 'check';
    check.textContent = '✓';
    item.appendChild(check);
    item.addEventListener('click', () => {
      setLang(code);
      langMenu.classList.remove('show');
    });
    langMenu.appendChild(item);
  });
}
langBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  langMenu.classList.toggle('show');
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.lang-wrap')) langMenu.classList.remove('show');
});

/* ---------- 初始化 ---------- */
// 先确定语言（本地保存 -> 浏览器语言 -> 默认 zh-CN），再渲染
try {
  const savedLang = localStorage.getItem(LANG_KEY);
  state.lang = (savedLang && LANGS[savedLang]) ? savedLang : detectLang();
} catch { state.lang = detectLang(); }
const initialQuery = new URLSearchParams(window.location.search).get('q');
if (initialQuery !== null) {
  state.query = initialQuery;
  searchInput.value = initialQuery;
  clearSearch.classList.toggle('show', initialQuery.length > 0);
}
renderLangMenu();
applyStaticI18n();
renderTabs();
renderMain();
searchInput.focus();

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
